<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filmora | Sign Up</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
    <div class="container nav">
        <a href="index.html" class="logo" aria-label="Filmora home"><span class="brand-mark">F</span><span class="brand-word">Filmora</span></a>
        <nav class="top-actions" aria-label="Account navigation"><a href="login.html" class="btn small">Login</a></nav>
    </div>
</header>
<main class="container form-page">
    <a href="index.html" class="back">&larr; Back to collection</a>
    <section class="form-card">
        <p class="eyebrow">JOIN FILMORA</p>
        <h1>Create your account</h1>
        <p class="subtitle">Build a private movie list in this browser and return to it anytime on this device.</p>
        <form id="signupForm">
            <label for="name">Name</label>
            <input id="name" name="name" autocomplete="name" required maxlength="100">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="email" required>
            <label for="password">Password</label>
            <div class="password-field"><input id="password" name="password" type="password" autocomplete="new-password" minlength="6" required><button type="button" class="password-toggle" data-password-toggle="password" aria-label="Show password">&#128065;</button></div>
            <label for="confirmPassword">Confirm password</label>
            <div class="password-field"><input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" minlength="6" required><button type="button" class="password-toggle" data-password-toggle="confirmPassword" aria-label="Show password">&#128065;</button></div>
            <button type="submit" class="btn primary full">Create Account</button>
        </form>
        <div id="authMessage" hidden></div>
        <p class="auth-switch">Already have an account? <a href="login.html">Log in</a></p>
    </section>
</main>
<footer><p>Filmora &copy; <span id="currentYear"></span> &middot; Static account demo</p></footer>
<script src="auth.js"></script>
<script>document.getElementById('currentYear').textContent = new Date().getFullYear();</script>
</body>
</html>
